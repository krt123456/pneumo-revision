name: Fasih APK - emulator tests
# Installs the signed APK (branch "fasih-test") on Android emulators and tests it; results go to "fasih-results-<api>".
on:
  push:
    branches: [fasih-test]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fasih-test
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Playwright
        run: npm i --no-save --no-audit --no-fund playwright-core@1.49.1
      - name: Emulator and tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: node test/run.mjs ${{ matrix.api }} fasih.apk
      - name: Publish results
        if: always()
        shell: bash
        run: |
          D=results-${{ matrix.api }}
          mkdir -p "$D"
          python3 -m pip install --quiet --disable-pip-version-check pillow || true
          python3 - "$D" <<'PY' || true
          import sys, glob, os
          from PIL import Image
          for f in sorted(glob.glob(sys.argv[1] + '/*.png')):
              im = Image.open(f).convert('RGB'); w, h = im.size
              im.resize((w * 2 // 5, h * 2 // 5), Image.LANCZOS).save(f[:-4] + '.jpg', quality=78)
              os.remove(f)
          PY
          cd "$D"
          git init -q -b "fasih-results-${{ matrix.api }}"
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "tests API ${{ matrix.api }}: ${{ job.status }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "fasih-results-${{ matrix.api }}"
